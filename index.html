<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Intentional Group | Coming Soon</title>
<meta name="description" content="The Intentional Group. Our new website is under construction.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;1,400&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    background:#0e0e0d;color:#f2efe9;
    font-family:"Inter",system-ui,-apple-system,sans-serif;
    display:flex;flex-direction:column;min-height:100vh;
    -webkit-font-smoothing:antialiased;
  }
  header,footer{padding:28px 40px;display:flex;justify-content:space-between;align-items:center;
    font-size:11px;letter-spacing:.22em;text-transform:uppercase;color:#8d8a84}
  main{flex:1;display:flex;flex-direction:column;justify-content:center;align-items:center;
    text-align:center;padding:40px 24px}
  .eyebrow{font-size:11px;letter-spacing:.32em;text-transform:uppercase;color:#b9a77f;margin-bottom:28px}
  h1{font-family:"Cormorant Garamond",Georgia,serif;font-weight:400;
    font-size:clamp(44px,8vw,96px);line-height:1;letter-spacing:-.01em}
  h1 em{font-style:italic;color:#d9cfb8}
  .rule{width:56px;height:1px;background:#b9a77f;margin:40px auto}
  p.lead{font-size:15px;font-weight:300;color:#bdb9b1;max-width:440px;line-height:1.7}
  a.contact{display:inline-block;margin-top:36px;color:#f2efe9;text-decoration:none;
    font-size:14px;letter-spacing:.08em;padding-bottom:6px;border-bottom:1px solid #4a4741;
    transition:border-color .3s,color .3s}
  a.contact:hover{border-color:#b9a77f;color:#d9cfb8}
  @media (max-width:600px){header,footer{padding:22px;font-size:10px}}
</style>
</head>
<body>
  <header>
    <span>The Intentional Group</span>
    <span>Los Angeles</span>
  </header>
  <main>
    <div class="eyebrow">Under Construction</div>
    <h1>Something <em>intentional</em><br>is coming.</h1>
    <div class="rule"></div>
    <p class="lead">Our new website is on the way. In the meantime, we would love to hear from you.</p>
    <a class="contact" href="mailto:drake@theintentionalgroup.org">drake@theintentionalgroup.org</a>
  </main>
  <footer>
    <span>&copy; 2026 The Intentional Group</span>
    <span>theintentionalgroup.org</span>
  </footer>
</body>
</html>
